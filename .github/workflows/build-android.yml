name: Build Android App Bundle (AAB) & APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx3072m -Dorg.gradle.jvmargs='-Xmx3072m -XX:+UseG1GC'"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Ensure Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          cd android/app
          python3 ensure_keystore.py

      - name: Build Web App and Sync to Android Assets
        run: |
          npm ci || npm install
          npm run build
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/

      - name: Build Android App Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload Release AAB to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Prepare Direct Download APK
        run: |
          mkdir -p release_assets
          cp android/app/build/outputs/apk/release/*.apk release_assets/bilingo-radio.apk || true

      - name: Publish Direct APK to GitHub Releases (No Zip)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: "BiLingo Radio (最新免解壓 APK)"
          body: |
            🚀 **BiLingo Radio 最新 APK 安裝包（免解壓縮）**
            
            點擊下方 Assets 中的 `bilingo-radio.apk` 即可直接下載 `.apk` 安裝檔到手機進行安裝！
          draft: false
          prerelease: false
          make_latest: true
          files: release_assets/bilingo-radio.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true

      - name: Run Android Cloud Emulator Automatic Test
        uses: ReactiveCircus/android-emulator-runner@v2
        if: success()
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            echo "=== 1. 清理舊版 App 並強制覆蓋安裝最新 APK ==="
            adb uninstall com.bilingo.radio || true
            adb install -r -g release_assets/bilingo-radio.apk || adb install -r -g android/app/build/outputs/apk/release/*.apk || adb install -r -g android/app/build/outputs/apk/debug/*.apk
            echo "=== 2. 自動啟動 BiLingo Radio App 主畫面 ==="
            adb shell am start -n com.bilingo.radio/com.bilingo.radio.MainActivity
            echo "=== 3. 等待 App 啟動並完成 WebView 渲染 (15 秒) ==="
            sleep 15
            echo "=== 4. 抓取雲端模擬器即時螢幕截圖 ==="
            mkdir -p emulator_test
            adb exec-out screencap -p > emulator_test/app_startup_screenshot.png
            echo "=== 5. 匯出 Logcat 偵錯紀錄 ==="
            adb logcat -d > emulator_test/app_logcat.log
            echo "=== 雲端模擬器自動執行與開機測試完成！ ==="

      - name: Upload Emulator Test Screenshot & Logcat
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-startup-test-results
          path: emulator_test/
          if-no-files-found: ignore

