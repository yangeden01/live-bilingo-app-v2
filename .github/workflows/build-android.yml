name: Build Android App Bundle (AAB) & APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx3072m -Dorg.gradle.jvmargs='-Xmx3072m -XX:+UseG1GC'"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Verify and Ensure Gradle Wrapper
        run: |
          mkdir -p android/gradle/wrapper
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ] || ! unzip -t android/gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "⚠️ Downloading clean gradle-wrapper.jar..."
            curl -sLo android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi
          cd android && gradle wrapper --gradle-version 8.7 || true

      # 上傳金鑰只從 Secrets 解到 repo 外的暫存目錄；缺少或無效時直接失敗，不會產生新金鑰
      - name: Ensure Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          cd android/app
          python3 ensure_keystore.py

      - name: Build Web App and Sync to Android Assets
        run: |
          npm ci || npm install
          npm run build
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/
          cp -r dist/* android/app/src/main/assets/www/

      - name: Build Android App Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Show Upload Key Fingerprint
        run: |
          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -1)
          echo "=== AAB 簽署憑證（核對 Play Console 的上傳金鑰 SHA-256）==="
          keytool -printcert -jarfile "$AAB" | grep -E "SHA256|Owner"

      - name: Upload Release AAB to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      # 模擬器專用 APK：-PuseTestAds=true 讓 release 也改用 Google 測試廣告，
      # 避免雲端模擬器載入正式廣告。放在正式 AAB／APK 上傳到 Artifacts 之後才建置，
      # 所以上架用的 AAB 維持正式廣告。
      # 2026-11-21 起不再把 APK 公開發布到 GitHub Releases（避免帶正式廣告的 APK 外流）。
      - name: Build Emulator Test APK (Test Ads)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PuseTestAds=true --no-daemon --stacktrace
          mkdir -p ../emulator_apk
          cp app/build/outputs/apk/release/*.apk ../emulator_apk/bilingo-radio-testads.apk

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true

      - name: Run Android Cloud Emulator Automatic Test & Quality Check
        uses: ReactiveCircus/android-emulator-runner@v2
        if: success()
        with:
          api-level: 29
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu guest -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            echo "=== 1. 清理舊版 App 並強制覆蓋安裝最新 APK ==="
            adb uninstall com.bilingo.radio || true
            # 只安裝測試廣告版本（-PuseTestAds=true 的 release，失敗時退回 debug，debug 本身也用測試廣告）
            adb install -r -g emulator_apk/bilingo-radio-testads.apk || adb install -r -g android/app/build/outputs/apk/debug/*.apk
            echo "=== 2. 自動啟動 BiLingo Radio App 主畫面 ==="
            adb shell am start -n com.bilingo.radio/com.bilingo.radio.MainActivity
            echo "=== 3. 等待 App 啟動並完成 WebView 渲染 (12 秒) ==="
            sleep 12
            echo "=== 4. 抓取雲端模擬器即時螢幕截圖 ==="
            mkdir -p emulator_test
            adb exec-out screencap -p > emulator_test/app_startup_screenshot.png || true
            echo "=== 5. 匯出 Logcat 偵錯紀錄 ==="
            adb logcat -d > emulator_test/app_logcat.log || true
            echo "=== 6. 執行品質檢測 (Quality Gate Check) ==="
            pip install --upgrade pillow || python3 -m pip install pillow || true
            python3 scripts/quality_gate.py
            echo "=== 雲端模擬器自動執行與開機測試通過！ ==="

      - name: Upload Emulator Test Screenshot & Logcat
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-startup-test-results
          path: emulator_test/
          if-no-files-found: ignore
