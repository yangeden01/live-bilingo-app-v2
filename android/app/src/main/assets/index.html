    <script>
      // Automatic error handling for stale module script loading failures (Web/HTTP only)
      window.addEventListener('error', function(e) {
        var isNativeApp = !!(window.AndroidBridge) || 
          location.protocol === 'file:' || 
          navigator.userAgent.includes('AndroidApp');

        if (!isNativeApp && location.protocol.startsWith('http')) {
          if (e.target && e.target.tagName === 'SCRIPT') {
            console.warn('Resource script load error detected:', e.target.src);
            try {
              var storage = window.sessionStorage;
              if (storage && storage.getItem('bilingo_reload_attempted') !== 'true') {
                storage.setItem('bilingo_reload_attempted', 'true');
                if ('serviceWorker' in navigator) {
                  navigator.serviceWorker.getRegistrations().then(function(regs) {
                    regs.forEach(function(r) { r.unregister(); });
                  });
                }
                if (window.caches) {
                  caches.keys().then(function(keys) {
                    keys.forEach(function(k) { caches.delete(k); });
                  });
                }
                window.location.reload();
              }
            } catch (err) {}
          }
        }
      }, true);
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        const isNativeApp = !!(window.AndroidBridge) || 
          location.hostname === 'appassets.android.com' || 
          location.protocol === 'file:' || 
          navigator.userAgent.includes('AndroidApp');

        const isDev = isNativeApp || 
          location.hostname === 'localhost' || 
          location.hostname.includes('ais-dev') || 
          location.hostname.includes('run.app');

        if (isDev) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
          if (window.caches) {
            caches.keys().then((names) => {
              for (let name of names) caches.delete(name);
            });
          }
        } else if (location.protocol.startsWith('http')) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
              .then((reg) => {
                console.log('SW Registered:', reg.scope);
                reg.update().catch(() => {});
              })
              .catch((err) => console.log('SW Register error:', err));
          });
        }
      }
    </script>
