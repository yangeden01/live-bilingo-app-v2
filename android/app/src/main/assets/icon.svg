<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#e11d48" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Maskable background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Ambient Glow Behind Video Tile -->
  <circle cx="256" cy="220" r="160" fill="#e11d48" opacity="0.15" />

  <!-- Video Screen Rounded Card -->
  <rect x="116" y="90" width="280" height="200" rx="44" fill="url(#cardGrad)" filter="url(#glow)"/>

  <!-- Centered Video Play Triangle -->
  <polygon points="230,150 310,190 230,230" fill="#ffffff"/>

  <!-- Dual Bilingual Subtitles Indicator Bars Under Player -->
  <!-- Line 1 (English Subtitle: Cyan Sky Blue) -->
  <rect x="146" y="320" width="220" height="20" rx="10" fill="#38bdf8"/>
  <!-- Line 2 (Chinese Translation: Warm Amber Gold) -->
  <rect x="176" y="356" width="160" height="20" rx="10" fill="#fbbf24"/>

  <!-- Text Label -->
  <text x="256" y="426" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="1">Bilingo 雙語</text>
  <text x="256" y="462" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-weight="700" font-size="22" fill="#fb7185" text-anchor="middle" letter-spacing="0.5">for YouTube</text>
</svg>